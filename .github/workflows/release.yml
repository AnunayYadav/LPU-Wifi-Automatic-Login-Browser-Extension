name: Publish Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          if [ -z "${{ github.ref_name }}" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Package Extension
        run: |
          mkdir -p dist
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Packaging version ${VERSION}..."
          zip -r "dist/LPU-Wifi-Auto-Login-v${VERSION}.zip" manifest.json background.js content.js popup.html popup.css popup.js fonts icons
          cp "dist/LPU-Wifi-Auto-Login-v${VERSION}.zip" "dist/LPU-Wifi-Auto-Login-Extension.zip"
          ls -lh dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "LPU Wi-Fi Auto-Login ${{ steps.get_version.outputs.TAG_NAME }}"
          files: |
            dist/*.zip
          draft: false
          prerelease: false
          body: |
            ## 🚀 LPU Wi-Fi Captive Portal Auto-Login

            Automatic, background silent login and keep-alive for all Lovely Professional University (LPU) campus Wi-Fi networks.

            ---

            ### 📥 Direct Download & Installation Guide

            1. **Download the Extension:**
               Click and download [**`LPU-Wifi-Auto-Login-Extension.zip`**](https://github.com/AnunayYadav/LPU-Wifi-Automatic-Login-Browser-Extension/releases/latest/download/LPU-Wifi-Auto-Login-Extension.zip) from the Assets list below.

            2. **Extract the Zip:**
               Right-click the downloaded zip and extract it into a folder on your computer.

            3. **Open Browser Extensions Page:**
               - **Brave**: `brave://extensions`
               - **Chrome**: `chrome://extensions`
               - **Edge**: `edge://extensions`

            4. **Enable Developer Mode:**
               Turn on the **Developer mode** toggle in the top-right corner.

            5. **Load the Extension:**
               Click the **Load unpacked** button and select the extracted folder.

            6. **Configure:**
               Click the extension icon in your toolbar, enter your LPU Registration Number & Password, and click **Save**. You're all set!
